<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEP 2020 — View Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary:  #1a2332;
            --secondary:#2d4059;
            --accent:   #ea5455;
            --success:  #26de81;
            --bg:       #f0f2f5;
            --white:    #ffffff;
            --text:     #1a2332;
            --muted:    #6c757d;
            --border:   #dee2e6;
        }
 
        * { margin:0; padding:0; box-sizing:border-box; }
 
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
 
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content:'';
            position:absolute; top:-60%; right:-5%;
            width:400px; height:400px; border-radius:50%;
            background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);
        }
        .header h1 {
            font-family:'Fraunces',serif;
            font-size:2.2rem; font-weight:700;
            position:relative; z-index:1;
            margin-bottom:0.4rem;
        }
        .header p {
            opacity:0.75; font-size:0.95rem;
            position:relative; z-index:1;
        }
        .header .badge {
            display:inline-block;
            background:rgba(234,84,85,0.25);
            border:1px solid rgba(234,84,85,0.5);
            color:#ffaaaa;
            font-size:0.72rem; font-weight:700;
            letter-spacing:1.5px; text-transform:uppercase;
            padding:0.3rem 0.9rem; border-radius:20px;
            margin-bottom:1rem; position:relative; z-index:1;
        }
 
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
 
        .filter-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.75rem 2rem;
            box-shadow: 0 2px 12px rgba(26,35,50,0.08);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .filter-card h2 {
            font-family:'Fraunces',serif;
            font-size:1.3rem; font-weight:600;
            color:var(--primary); margin-bottom:1.25rem;
        }
        .filter-row {
            display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end;
        }
        .filter-group {
            display:flex; flex-direction:column; gap:0.4rem;
            flex:1; min-width:180px;
        }
        .filter-label {
            font-size:0.82rem; font-weight:600;
            color:var(--text); letter-spacing:0.3px;
        }
        .filter-select {
            padding:0.8rem 1rem;
            border:2px solid var(--border); border-radius:10px;
            font-family:'DM Sans',sans-serif; font-size:0.95rem;
            background:#fafafa; color:var(--text);
            transition:all 0.2s ease;
        }
        .filter-select:focus {
            outline:none; border-color:var(--accent);
            background:white; box-shadow:0 0 0 3px rgba(234,84,85,0.1);
        }
        .btn-view {
            padding:0.8rem 2rem;
            background:linear-gradient(135deg,var(--accent) 0%,#ff6b6b 100%);
            color:white; border:none; border-radius:10px;
            font-family:'DM Sans',sans-serif; font-weight:700;
            font-size:0.95rem; cursor:pointer;
            transition:all 0.25s ease;
            box-shadow:0 4px 14px rgba(234,84,85,0.3);
            white-space:nowrap;
        }
        .btn-view:hover {
            transform:translateY(-2px);
            box-shadow:0 6px 20px rgba(234,84,85,0.4);
        }
 
        .export-row {
            display:flex; gap:0.75rem; flex-wrap:wrap;
            margin-bottom:1.5rem;
        }
        .btn-export {
            padding:0.6rem 1.2rem;
            border:2px solid var(--border); border-radius:8px;
            background:var(--white); color:var(--text);
            font-family:'DM Sans',sans-serif; font-weight:600;
            font-size:0.85rem; cursor:pointer;
            transition:all 0.2s ease;
            display:flex; align-items:center; gap:0.4rem;
        }
        .btn-export:hover { border-color:var(--accent); color:var(--accent); }
 
        .timetable-wrap {
            overflow-x: auto;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(26,35,50,0.08);
            border: 1px solid var(--border);
            padding: 1rem;
        }
        .timetable {
            width:100%; border-collapse:collapse;
            min-width:900px;
        }
        .timetable th {
            background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
            color:white; padding:0.85rem 0.75rem;
            font-size:0.85rem; font-weight:600;
            text-align:center;
        }
        .timetable td {
            border:1px solid #e9ecef;
            padding:6px; text-align:center;
            vertical-align:top; min-width:130px;
        }
        .cell-empty { background:#fafafa; min-height:70px; }
 
        .entry {
            border-radius:8px; padding:6px 8px;
            margin-bottom:3px; text-align:left;
            border:1px solid rgba(0,0,0,0.07);
        }
        .entry-badges { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:3px; }
        .badge-type {
            font-size:0.64rem; font-weight:700; color:white;
            padding:2px 5px; border-radius:4px;
        }
        .badge-lab   { background:#1565c0; }
        .badge-theory{ background:#2e7d32; }
        .badge-prog  { font-size:0.62rem; font-weight:700; color:white; padding:2px 5px; border-radius:4px; }
        .entry-code  { font-weight:700; color:var(--accent); font-size:0.8rem; margin:2px 0; }
        .entry-name  { font-size:0.75rem; color:#333; }
        .entry-meta  { font-size:0.7rem; color:var(--muted); margin-top:2px; }
 
        .break-row td {
            font-weight:700; text-align:center;
            font-size:0.85rem; padding:0.6rem;
        }
 
        .alert {
            padding:1rem 1.25rem; border-radius:12px;
            font-size:0.9rem; font-weight:500;
            display:flex; align-items:center; gap:0.75rem;
            margin-bottom:1rem;
        }
        .alert-info    { background:#d1ecf1; color:#0c5460; border:2px solid #bee5eb; }
        .alert-error   { background:#f8d7da; color:#721c24; border:2px solid #f5c6cb; }
        .alert-success { background:#d4edda; color:#155724; border:2px solid #c3e6cb; }
 
        .footer {
            text-align:center; padding:2rem;
            color:var(--muted); font-size:0.8rem;
        }
        .footer a { color:var(--accent); text-decoration:none; }
 
        @media(max-width:768px) {
            .container { padding:1rem; }
            .header h1 { font-size:1.6rem; }
            .filter-row { flex-direction:column; }
        }
    </style>
</head>
<body>
 
<!-- ── Header ── -->
<div class="header">
    <div class="badge">NEP 2020 Compliant</div>
    <h1>📅 Class Timetable</h1>
    <p>Select your programme and semester to view your timetable</p>
</div>
 
<div class="container">
 
    <!-- ── Filters ── -->
    <div class="filter-card">
        <h2>🔍 Find Your Timetable</h2>
        <div class="filter-row">
            <div class="filter-group">
                <label class="filter-label">Programme</label>
                <select class="filter-select" id="selProgram">
                    <option value="All Programs">All Programmes</option>
                    <option value="B.Ed.">B.Ed.</option>
                    <option value="M.Ed.">M.Ed.</option>
                    <option value="FYUP">FYUP</option>
                    <option value="ITEP">ITEP</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Semester</label>
                <select class="filter-select" id="selSemester">
                    <option value="all">All Semesters</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Faculty (optional)</label>
                <select class="filter-select" id="selFaculty">
                    <option value="">All Faculty</option>
                </select>
            </div>
            <button class="btn-view" onclick="applyFilters()">View Timetable</button>
        </div>
    </div>
 
    <!-- ── Status ── -->
    <div id="statusBox"></div>
 
    
    <div class="export-row" id="exportRow" style="display:none;">
        <button class="btn-export" onclick="exportPDF()">📄 Export PDF</button>
        <button class="btn-export" onclick="exportExcel()">📊 Export Excel</button>
        <button class="btn-export" onclick="window.print()">🖨️ Print</button>
    </div>
 
    
    <div id="timetableWrap" style="display:none;" class="timetable-wrap">
        <div id="timetableOut"></div>
    </div>
 
</div>
 
<div class="footer">
    NEP 2020 Timetable Generator &nbsp;·&nbsp;
    <a href="login.html">Staff Login</a>
</div>
 
<script>
const API = "http://127.0.0.1:8000";
 
const PROG_COLORS = {
    "B.Ed.":"#1565c0","M.Ed.":"#6a1b9a","FYUP":"#2e7d32","ITEP":"#e65100"
};
 
const BREAK_AFTER = {
    1:"☕ Short Break (10:40 – 10:50 AM)",
    3:"🍽 Lunch Break (12:30 – 1:30 PM)",
    5:"☕ Short Break (3:10 – 3:20 PM)"
};
 
let fullTimetable  = null;  
let filteredTable  = null; 
let savedAt        = null;
 

window.onload = async function () {
    showStatus("info", "⏳ Loading timetable from server...");
    try {
        const res = await fetch(`${API}/load-timetable`);
        if (res.status === 404) {
            showStatus("info",
                "📅 No timetable has been generated yet. Ask the Admin to generate one first."
            );
            return;
        }
        if (!res.ok) {
            showStatus("error", "❌ Server error. Make sure the backend is running.");
            return;
        }
        const data = await res.json();
        fullTimetable = data.timetable;
        savedAt       = data.saved_at;
 
       
        populateFacultyDropdown();
 
        
        applyFilters();
 
    } catch (e) {
        showStatus("error",
            "❌ Cannot connect to server. Run: <code>uvicorn main:app --reload</code>"
        );
    }
};
 

function populateFacultyDropdown() {
    if (!fullTimetable) return;
    const names = new Set();
    for (const day in fullTimetable) {
        for (const slot in fullTimetable[day]) {
            const cell = fullTimetable[day][slot];
            if (!cell) continue;
            const cells = Array.isArray(cell) ? cell : [cell];
            cells.forEach(c => { if (c.faculty) names.add(c.faculty); });
        }
    }
    const sel = document.getElementById("selFaculty");
    sel.innerHTML = `<option value="">All Faculty</option>`;
    [...names].sort().forEach(n => {
        sel.innerHTML += `<option value="${n}">${n}</option>`;
    });
}
 

function applyFilters() {
    if (!fullTimetable) return;
 
    const prog    = document.getElementById("selProgram").value;
    const sem     = document.getElementById("selSemester").value;
    const facName = document.getElementById("selFaculty").value;
 
   
    filteredTable = {};
    const days  = Object.keys(fullTimetable);
    const slots = Object.keys(fullTimetable[days[0]]);
 
    days.forEach(day => {
        filteredTable[day] = {};
        slots.forEach(slot => {
            const cell  = fullTimetable[day][slot];
            const cells = !cell ? [] : Array.isArray(cell) ? cell : [cell];
 
            let visible = cells;
            if (prog    && prog    !== "All Programs") visible = visible.filter(c => c.program === prog);
            if (sem     && sem     !== "all")          visible = visible.filter(c => c.semester == sem);
            if (facName && facName !== "")             visible = visible.filter(c => c.faculty === facName);
 
            filteredTable[day][slot] = visible.length === 0 ? null
                : visible.length === 1 ? visible[0]
                : visible;
        });
    });
 
    renderTimetable();
}
 

function renderTimetable() {
    const days  = Object.keys(filteredTable);
    const slots = Object.keys(filteredTable[days[0]]);
 
    
    let hasData = false;
    days.forEach(day => slots.forEach(slot => {
        if (filteredTable[day][slot] !== null) hasData = true;
    }));
 
    if (!hasData) {
        document.getElementById("timetableWrap").style.display = "none";
        document.getElementById("exportRow").style.display     = "none";
        showStatus("info",
            "📭 No classes found for the selected filters. Try changing Programme or Semester."
        );
        return;
    }
 
    const when = savedAt ? `Last updated: ${savedAt}` : "";
    showStatus("success", `✅ Timetable loaded. ${when}`);
 
    let html = `<table class="timetable"><thead><tr><th>Time / Day</th>`;
    days.forEach(day => html += `<th>${day}</th>`);
    html += `</tr></thead><tbody>`;
 
    slots.forEach((slot, idx) => {
        html += `<tr><td style="font-weight:600;font-size:0.8rem;background:#f8f9fa;white-space:nowrap;">
                    ${to12Hour(slot)}
                 </td>`;
        days.forEach(day => {
            html += buildTd(filteredTable[day][slot]);
        });
        html += `</tr>`;
 
        if (BREAK_AFTER[idx] !== undefined) {
            const bg = idx === 3 ? "#ffd6cc" : "#fff9c4";
            html += `<tr class="break-row">
                        <td colspan="${days.length+1}" style="background:${bg};">
                            ${BREAK_AFTER[idx]}
                        </td>
                     </tr>`;
        }
    });
 
    html += `</tbody></table>`;
    document.getElementById("timetableOut").innerHTML = html;
    document.getElementById("timetableWrap").style.display = "block";
    document.getElementById("exportRow").style.display     = "flex";
}
 

function buildTd(cellData) {
    const cells = !cellData ? [] : Array.isArray(cellData) ? cellData : [cellData];
    if (cells.length === 0) return `<td class="cell-empty"></td>`;
 
    const inner = cells.map(c => {
        const bg      = c.type && c.type.startsWith("Lab") ? "#e3f2fd" : "#f0fdf4";
        const typeCls = c.type && c.type.startsWith("Lab") ? "badge-lab" : "badge-theory";
        const typeLabel = c.type && c.type.startsWith("Lab") ? "LAB" : "THEORY";
        const progColor = PROG_COLORS[c.program] || "#607d8b";
        return `
            <div class="entry" style="background:${bg};">
                <div class="entry-badges">
                    <span class="badge-type ${typeCls}">${typeLabel}</span>
                    ${c.program ? `<span class="badge-prog" style="background:${progColor};">${c.program}</span>` : ""}
                </div>
                <div class="entry-code">${c.course || ""}</div>
                <div class="entry-name">${c.name || ""}</div>
                <div class="entry-meta">👤 ${c.faculty || ""}</div>
                <div class="entry-meta">🚪 ${c.room || ""}</div>
            </div>`;
    }).join("");
 
    return `<td style="vertical-align:top;padding:5px;">${inner}</td>`;
}
 

function showStatus(type, msg) {
    document.getElementById("statusBox").innerHTML =
        `<div class="alert alert-${type}">${msg}</div>`;
}
 

function to12Hour(range) {
    function convert(t) {
        let [h, m] = t.split(":");
        h = parseInt(h);
        const p = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${String(h).padStart(2,"0")}:${m} ${p}`;
    }
    const [s, e] = range.split("-");
    return `${convert(s)} – ${convert(e)}`;
}
 

function exportPDF() {
    if (!filteredTable) return;
    const { jsPDF } = window.jspdf;
    const doc   = new jsPDF({ orientation:"landscape" });
    const days  = Object.keys(filteredTable);
    const slots = Object.keys(filteredTable[days[0]]);
 
    doc.setFontSize(14);
    doc.text("NEP 2020 Class Timetable", 14, 14);
    if (savedAt) { doc.setFontSize(9); doc.text(`Generated: ${savedAt}`, 14, 20); }
 
    const rows = [];
    slots.forEach((slot, idx) => {
        const row = [to12Hour(slot)];
        days.forEach(day => {
            const cell  = filteredTable[day][slot];
            const cells = !cell ? [] : Array.isArray(cell) ? cell : [cell];
            row.push(cells.map(c =>
                `${c.course}\n${c.name}\n${c.faculty}\n${c.room} [${c.type}]`
            ).join("\n---\n") || "—");
        });
        rows.push(row);
        if (BREAK_AFTER[idx]) {
            rows.push([{
                content: BREAK_AFTER[idx],
                colSpan: days.length + 1,
                styles: { halign:"center", fontStyle:"bold", fillColor:[255,249,196] }
            }]);
        }
    });
 
    doc.autoTable({
        startY: 25,
        head: [["Time", ...days]],
        body: rows,
        styles: { fontSize:7, cellPadding:2 },
        headStyles: { fillColor:[26,35,50] },
        columnStyles: { 0:{ cellWidth:28 } }
    });
    doc.save("Timetable.pdf");
}
 

function exportExcel() {
    if (!filteredTable) return;
    const days  = Object.keys(filteredTable);
    const slots = Object.keys(filteredTable[days[0]]);
    const data  = [["Time", ...days]];
 
    slots.forEach((slot, idx) => {
        const row = [to12Hour(slot)];
        days.forEach(day => {
            const cell  = filteredTable[day][slot];
            const cells = !cell ? [] : Array.isArray(cell) ? cell : [cell];
            row.push(cells.map(c =>
                `${c.course}\n${c.name}\n${c.faculty}\n${c.room} [${c.type}]`
            ).join("\n---\n") || "—");
        });
        data.push(row);
        if (BREAK_AFTER[idx]) {
            data.push([BREAK_AFTER[idx], ...days.map(() => "")]);
        }
    });
 
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch:22 }, ...days.map(() => ({ wch:35 }))];
    ws["!rows"] = data.map(() => ({ hpt:65 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Timetable");
    XLSX.writeFile(wb, "Timetable.xlsx");
}
</script>
</body>
</html>
